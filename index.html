{const q=new URLSearchParams(location.search).get('len');if(q)W.forEach(w=>w.len=+q)} // test shortcut: add ?len=4 to the page link to cycle worlds quickly

// Jungle ground textures (files in assets/textures/). Swap names here to try another road or side.

 const r=g.createRadialGradient(64,64,6,64,64,62);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.6,'rgba(255,255,255,.7)');r.addColorStop(1,'rgba(255,255,255,0)');

function burnLog(){ // burning log pile: jump over it
 const g=new THREE.Group(),F=fxm(),fl=[];

 const l2=new THREE.Mesh(F.lg,F.lm);l2.scale.set(.8,.8,.8);l2.rotation.z=Math.PI/2;l2.rotation.y=1.0;l2.position.y=.62;g.add(l2);
 const add=(m,k,o,x,y,z,sc)=>{const f=new THREE.Sprite(k==='s'?m.clone():m);f.userData=Object.assign({k,x,y,z,s:sc,p:Math.random()},o);f.position.set(x,y,z);f.scale.set(sc,sc,1);g.add(f);fl.push(f)};
 add(F.gl,'g',{},0,.6,.1,3.2);add(F.fi,'g',{},0,.8,.15,1.7);

 for(let i=0;i<5;i++)add(F.em,'e',{v:.35+Math.random()*.4},(Math.random()-.5)*1,1.3,0,.28);

function woodTex(){

const PW={},WN=['lily_large','lily_small','canoe','log_large','boat-row-small','boat-row-large','ship-small','ship-wreck','Dolphin','Manta ray','Shark','Fish','Dock Long','Dock Wide','Dock Stairs','Barrel 1','Crate 1','Crate 2','Torch 1','Fire Pit 1'];

 const g=new THREE.Group();g.add(o);g.userData=k;t.add(g);t.userData.cr.push(g);
 if(e.a.length){const m=new THREE.AnimationMixer(o);m.clipAction(e.a[0]).play();t.userData.mx.push(m)}
}
function bob(t,o){if(!o)return;o.userData={kind:'bob',y:o.position.y,p:Math.random()};t.userData.cr.push(o)}
function wprops(t,idx){
 const R=Math.random;
 for(const s of[-1,1]){
  if(R()<.75)for(let i=0;i<4;i++)bob(t,pw(t,R()<.6?'lily_large':'lily_small',s*(4.8+R()*3.2),(R()-.5)*28,4+R()*1.6,-.7));
  if(R()<.55)bob(t,pw(t,R()<.5?'boat-row-small':'boat-row-large',s*(6+R()*3),(R()-.5)*20,1.7,-1.0));
  if(R()<.18)bob(t,pw(t,R()<.5?'ship-small':'ship-wreck',s*(15+R()*5),(R()-.5)*20,1.8,-.9));
  if(R()<.12)pw(t,['Dock Long','Dock Wide','Dock Stairs'][Math.floor(R()*3)],s*7.2,(R()-.5)*8,.5,-.9,0);
  if(R()<.35){const c=R()<.5;bob(t,pw(t,c?'canoe':'log_large',s*(5+R()*3),(R()-.5)*24,c?4.5:4,-.85))}
 }
 const F=fxm();
 for(const sx of[-3.9,3.9])for(const z of[-12,12]){ // torches on the rail posts
  if(!pw(t,'Torch 1',sx,z,2.2,.9,0))continue;
  const add=(m,k,sc,y)=>{const f=new THREE.Sprite(m);f.userData={k,s:sc,x:sx,y,z,p:R()};f.position.set(sx,y,z);f.scale.set(sc,sc,1);t.add(f);t.userData.fl.push(f)};
  add(F.f5,'f',.9,2.35);add(F.gl,'g',2.2,2.3);
 }
 const J=[['Dolphin',.34],['Dolphin',.34],['Fish',.2]],GL2=[['Manta ray',.3],['Shark',.26]];
 const spawn=(c,kind,sd,y)=>crt(t,c[0],c[1],{kind,x:sd*(5.2+R()*4),y,z:(R()-.5)*14,p:R(),sp:kind==='jump'?.35+R()*.25:.2+R()*.15,ry:sd>0?-1.57:1.57});
 spawn(J[Math.floor(R()*3)],'jump',-1,0);spawn(J[Math.floor(R()*3)],'jump',1,0);spawn(GL2[Math.floor(R()*2)],'glide',R()<.5?-1:1,-1.05);
}
function wdec(t,x,z,s){const r=Math.random();
 if(r<.12)put(t,r<.06?'Rock_Medium_1':'Rock_Medium_3',x,z,.9+Math.random()*.8,-.9);
 else if(r<.7)put(t,'Grass_Wispy_Tall',s*(4.6+Math.random()*1.2),z,1.6,-.9);
}
function collapse(t,w){ // bridge section: two lanes sink as you approach, one stays
 const ls=Math.floor(Math.random()*3);t.userData.col=[];
 if(!w.pm){const pt=roadTex(w).clone();pt.needsUpdate=true;pt.wrapS=pt.wrapT=THREE.RepeatWrapping;pt.repeat.set(.275,.2);w.pm=new THREE.MeshLambertMaterial({map:pt})}
 for(let ln=0;ln<3;ln++)for(let i=0;i<5;i++){
  const m=new THREE.Mesh(G.pan||(G.pan=new THREE.BoxGeometry(2.1,.25,5.9)),w.pm);m.position.set(LX[ln],-.12,-12+i*6);t.add(m);
  if(ln!==ls)t.userData.col.push({m,k:0,on:0,r:(Math.random()<.5?-1:1)*(.4+Math.random()*.5)});
 }
 for(const sx of[-3.6,3.6])t.add(mk('box',0x5a3f26,sx,-.12,0,.8,.25,TL));
 for(let i=-2;i<=2;i++)item(t,mk('box',0xffd400,LX[ls],1,i*6,.55,.55,.12),'coin');

function colUpd(dt){for(const t of tiles)for(const p of t.userData.col||[]){
 if(!p.on&&t.position.z+p.m.position.z>-34)p.on=1;
 if(p.on&&p.k<1){p.k=Math.min(1,p.k+dt*1.8);p.m.position.y=-.12-p.k*1.6;p.m.rotation.x=p.r*p.k;p.m.rotation.z=p.r*.5*p.k}
}}
function potV(){ // rough patched-and-broken road with a pothole (cached variants)
 if(potV.v)return potV.v;
 const jag=(rx,rz,n,j)=>{const sh=new THREE.Shape();for(let i=0;i<n;i++){const a=i/n*6.283,r=1-j/2+Math.random()*j,x=Math.cos(a)*rx*r,y=Math.sin(a)*rz*r;i?sh.lineTo(x,y):sh.moveTo(x,y)}sh.closePath();return new THREE.ShapeGeometry(sh)};
 let lay=0;
 const fl=(g,c,y,x,z)=>{lay++;const tx_=lay<=2,m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:tx_?(lay===1?0xb0a8a0:0x8c857e):c,map:tx_?cmat().dmg:null,polygonOffset:true,polygonOffsetFactor:-lay,polygonOffsetUnits:-lay}));m.rotation.x=-Math.PI/2;m.position.set(x||0,y,z||0);return m};
 potV.v=[0,1,2,3,4].map(()=>{
  const g=new THREE.Group();lay=0;
  g.add(fl(jag(1.05,1.5,16,.18),0x303136,.014));
  g.add(fl(jag(.9,1.2,14,.25),0x232428,.018,.05,-.1));
  g.add(fl(jag(.78,.95,12,.4),0x4b3a2b,.024,0,.05));
  g.add(fl(jag(.6,.75,11,.45),0x15110d,.03,0,.05));
  g.add(fl(jag(.3,.4,9,.5),0x050505,.034,.05,.1));
  for(let i=0;i<7;i++){const a=Math.random()*6.28,d=.75+Math.random()*.35,m=mk('box',0x777a82,Math.cos(a)*d,.06,Math.sin(a)*d*1.2,.12+Math.random()*.14,.08+Math.random()*.1,.12+Math.random()*.14);m.rotation.y=Math.random()*3;g.add(m)}
  for(let i=0;i<3;i++){const c=fl(new THREE.PlaneGeometry(.05,1+Math.random()*.8),0x0a0a0c,.02,(Math.random()-.5)*1.6,(Math.random()-.5)*2);c.rotation.z=Math.random()*3;g.add(c)}
  return g;
 });
 return potV.v;
}
function fx(tm){
 if(wm.m){wm.m.map.offset.set(tm*.015,tm*.06);wm.m2.map.offset.set(-tm*.02,tm*.035)}
 for(const t of tiles)for(const c of t.userData.cr||[]){const k=c.userData,u=(tm*k.sp+k.p)%1;
  if(k.kind==='bob'){c.position.y=k.y+Math.sin(tm*1.6+k.p*6)*.07;c.rotation.z=Math.sin(tm*1.2+k.p*5)*.05;c.rotation.x=Math.sin(tm*.9+k.p*4)*.03}
  else if(k.kind==='jump'){c.position.set(k.x,-1.7+Math.sin(u*Math.PI)*2.6,k.z);c.rotation.set(-Math.cos(u*Math.PI)*.8,k.ry,0,'YXZ')}
  else{c.position.set(k.x,k.y,k.z+(u-.5)*10);c.rotation.set(0,k.ry,0)}}for(const t of tiles)for(const f of t.userData.fl||[]){const k=f.userData;
 if(k.k==='f'){const q=k.s*(1+.22*Math.sin(tm*12+k.p*9));f.scale.set(q*.6,q*1.15,1);f.position.y=k.y+Math.sin(tm*9+k.p*7)*.05}
 else if(k.k==='e'){const u=(tm*k.v+k.p)%1,q=.3*(1-u);f.position.set(k.x+Math.sin(tm*3+k.p*9)*.25,k.y+u*2.4,k.z);f.scale.set(q,q,1)}
 else if(k.k==='s'){const u=(tm*.3+k.p)%1,q=.9+u*1.5;f.position.set(k.x+u*.4,k.y+u*2.8,k.z);f.scale.set(q,q,1);f.material.opacity=.32*(1-u)}
 else{const q=k.s*(1+.1*Math.sin(tm*10+k.p*9));f.scale.set(q,q,1)}}}
function rootObj(){ // tree stump gripped by arching roots (unjumpable)
 if(!rootObj.s){
  const bt=TXL.load('assets/jungle/Bark_NormalTree.png');bt.wrapS=bt.wrapT=THREE.RepeatWrapping;bt.repeat.set(3,1);
  rootObj.m=new THREE.MeshStandardMaterial({map:bt,roughness:1,color:0x7d5a48});
  rootObj.s=new THREE.CylinderGeometry(.5,.85,2.4,12);rootObj.a=new THREE.TorusGeometry(1,.2,8,14,Math.PI);

 const g=new THREE.Group(),st=new THREE.Mesh(rootObj.s,[rootObj.m,M(0x9a7a50),rootObj.m]);

 for(let i=0;i<6;i++){const a=new THREE.Mesh(rootObj.a,rootObj.m);a.rotation.y=i*Math.PI/3+Math.random()*.4;a.scale.set(1+Math.random()*.3,.9+Math.random()*.5,1);g.add(a)}

 return cmat.r={road:m('aerial_asphalt_01_diff_2k.jpg',3,11),side:m('garage_floor_diff_1k.jpg',7,10),walk:m('marble_rock_02_diff_1k.jpg',.7,10),dmg:tx('road_damaged_2_diff_2k.jpg',.3,.3),
  walls:[0xd8d0c4,0xc2b8a8,0xe4dccd].map(c=>new THREE.MeshStandardMaterial({map:wt,color:c,roughness:1}))};

function bgeo(h){ // building box with texture scaled to its height (cached by height)

  for(let i=0;i<70;i++){g.fillStyle='rgba(200,180,150,'+(.2+Math.random()*.3)+')';g.beginPath();g.ellipse(20+Math.random()*216,Math.random()*960,2+Math.random()*4,1.5+Math.random()*3,0,0,6.3);g.fill()}
 }else{
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;
  for(let i=0;i<14;i++){let x=20+Math.random()*216,y=Math.random()*960;g.beginPath();g.moveTo(x,y);for(let k=0;k<5;k++){x+=(Math.random()-.5)*30;y+=8+Math.random()*22;g.lineTo(x,y)}g.stroke()}
 }
 const e=g.createLinearGradient(0,0,256,0),ec=jg?'rgba(40,95,30,':'rgba(0,0,0,';

 g.fillStyle=e;g.fillRect(0,0,256,960);
 if(!jg){g.fillStyle='#8a8d94';g.fillRect(0,0,9,960);g.fillRect(247,0,9,960)}

const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(R.domElement);
AX=Math.min(8,R.capabilities.getMaxAnisotropy());
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(70,1,.1,120);
S.background=new THREE.Color(W[0].sky);
S.fog=new THREE.Fog(W[0].sky,45,135);
S.add(new THREE.HemisphereLight(0xdff3ff,0x4a6b3a,1.1));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,5);S.add(dl);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

const MC={},M=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
const G={box:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(.5,.5,1,12),cone:new THREE.ConeGeometry(.5,1,8),plane:new THREE.PlaneGeometry(1,1)};
function mk(g,c,x,y,z,sx,sy,sz){
 const m=new THREE.Mesh(G[g],M(c));
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);
 if(g==='plane')m.rotation.x=-Math.PI/2;
 return m;
}

// Player (placeholder shapes; swap for a GLB model later)
const P=new THREE.Group();
const legL=mk('box',0x2b3a67,-.2,.4,0,.3,.8,.3),legR=mk('box',0x2b3a67,.2,.4,0,.3,.8,.3);
P.add(mk('box',0xe8a33d,0,1.1,0,.8,1,.5),mk('box',0xffd7a8,0,1.85,0,.5,.5,.5),legL,legR);
S.add(P);

// Real character + animations (falls back to the boxes above if loading fails)
let mixer=null;const acts={};let cur=null;
const AN={run:'Sprint_Loop',jump:'Jump_Start',slide:'Roll',die:'Death01',idle:'Idle_Loop',stumble:'Hit_Chest'},ONCE={jump:1,slide:1,die:1,stumble:1};
function play(n){
 const a=acts[n];if(!a||a===cur)return;
 a.reset();a.setLoop(ONCE[n]?THREE.LoopOnce:THREE.LoopRepeat);a.clampWhenFinished=true;
 a.fadeIn(.12).play();if(cur)cur.fadeOut(.12);cur=a;
}
const dbg=t=>{const d=document.getElementById('dbg');if(d)d.textContent=t};
THREE.DefaultLoadingManager.onError=u=>dbg('✗ could not load: '+u);
let ready=false;
THREE.DefaultLoadingManager.onProgress=(u,i,t)=>{if(!ready)dbg('Loading '+i+' / '+t+' files…')};
THREE.DefaultLoadingManager.onLoad=()=>{ready=true;dbg('v2 · ✓ ready')};
THREE.DefaultLoadingManager.setURLModifier(u=>u.replace('T_Eye_Normal_png.png','T_Eye_Normal.png').replace('T_Hair_1_BaseColor.png','T_Hair_1_BaseColor_png.png').replace('T_Hair_1_Normal_png.png','T_Hair_1_Normal.png'));
const GL=new THREE.GLTFLoader();
// Jungle props (Quaternius Stylized Nature MegaKit); old shapes stay as fallback
const PR={};
function put(t,n,x,z,sc,y){const o=PR[n]&&PR[n].clone(true);if(!o)return;o.position.set(x,y||0,z);o.scale.setScalar(sc);o.rotation.y=Math.random()*6.28;t.add(o)}
const TR=['CommonTree_3','CommonTree_5','Pine_5'],UG=[['Bush_Common',1.3],['Fern_1',.4],['Plant_1_Big',.9],['Rock_Medium_1',.5],['Rock_Medium_3',.45],['Grass_Wispy_Tall',1.2],['Flower_3_Group',1],['Mushroom_Common',2]];
function jdec(t,x,z,s){
 put(t,TR[Math.floor(Math.random()*3)],x,z,.9+Math.random()*.5);
 const u=UG[Math.floor(Math.random()*UG.length)];
 put(t,u[0],s*(4.5+Math.random()*2.2),z+(Math.random()-.5)*6,u[1]*(.8+Math.random()*.4));
}
const PN=['CommonTree_3','CommonTree_5','Pine_5','Bush_Common','Fern_1','Plant_1_Big','Grass_Wispy_Tall','Rock_Medium_1','Rock_Medium_3','Mushroom_Common','Flower_3_Group'];
let pd=0;
WN.forEach(n=>GL.load('assets/water/'+encodeURIComponent(n)+'.glb',g=>{PW[n]={s:g.scene,a:g.animations};fin()},null,()=>fin()));
PN.forEach(n=>GL.load('assets/jungle/'+n+'.gltf',g=>{PR[n]=g.scene;fin()},null,()=>fin()));
function fin(){if(++pd===PN.length+WN.length){dbg('✓ ready · jungle '+Object.keys(PR).length+'/'+PN.length+' · water '+Object.keys(PW).length+'/'+WN.length);if(!run)tiles.forEach(t=>build(t,t.userData.idx))}}
// ---- Runner skins: the Superhero (UAL animations) + dressed characters (own animations)
const SK=[
 {id:'hero',name:'Hero',type:'ual',file:'assets/characters/superhero/Superhero_Male_FullBody.gltf'},
 {id:'Casual',name:'Casual',type:'mod',file:'assets/characters/women/Casual.gltf'},
 {id:'Worker',name:'Worker',type:'mod',file:'assets/characters/women/Worker.gltf'},
 {id:'Suit',name:'Suit',type:'mod',file:'assets/characters/women/Suit.gltf'},
 {id:'Formal',name:'Formal',type:'mod',file:'assets/characters/women/Formal.gltf'}
],AM={run:'Run',jump:'Roll',slide:'Roll',die:'Death',idle:'Idle',stumble:'HitRecieve'};
let UALc=null,skinId='hero';
try{skinId=new URLSearchParams(location.search).get('skin')||localStorage.getItem('skin')||'hero'}catch(e){}
function loadSkin(id){
 const sk=SK.find(x=>x.id===id)||SK[0];
 GL.load(sk.file,g=>{
  const h=g.scene;h.rotation.y=Math.PI;
  const setup=clips=>{
   mixer=new THREE.AnimationMixer(h);for(const k in acts)delete acts[k];cur=null;
   const M=sk.type==='ual'?AN:AM;
   for(const k in M){let c=THREE.AnimationClip.findByName(clips,M[k]);if(!c)continue;c=c.clone();c.tracks=c.tracks.filter(t=>!/^[rR]oot\.position/.test(t.name));acts[k]=mixer.clipAction(c,h)}
   if(acts.slide)acts.slide.setDuration(.6);if(acts.stumble)acts.stumble.setDuration(.7);
   if(sk.type!=='ual'){if(acts.jump)acts.jump.setDuration(.75);if(acts.run)acts.run.timeScale=1.3}
   P.children.slice().forEach(c=>P.remove(c));P.add(h);play(run?'run':'idle');
   skinId=sk.id;try{localStorage.setItem('skin',sk.id)}catch(e){}
   const b=document.getElementById('skin');if(b)b.textContent='Runner: '+sk.name+'  ▶';
   dbg('✓ runner ready: '+sk.name);
  };
  if(sk.type!=='ual')return setup(g.animations);
  if(UALc)return setup(UALc);
  GL.load('assets/animations/UAL1_Standard_RM.glb',a=>{UALc=a.animations;setup(UALc)},null,e=>dbg('✗ animations failed: '+(e&&e.message||'check file path')));
 },null,e=>{dbg('✗ '+sk.name+' not found, using Hero');if(sk.id!=='hero')loadSkin('hero')});
}
loadSkin(skinId);
document.getElementById('skin').addEventListener('pointerup',e=>{e.stopPropagation();if(run)return;const i=SK.findIndex(x=>x.id===skinId);loadSkin(SK[(i+1)%SK.length].id)});
document.getElementById('skin').addEventListener('pointerdown',e=>e.stopPropagation());


// Tiles
const tiles=[];let tc=0,since=9;
for(let i=0;i<NT;i++){const t=new THREE.Group();S.add(t);tiles.push(t)}

function item(t,m,type,solid){m.userData={type};t.add(m)}

function build(t,idx){
 while(t.children.length)t.remove(t.children[0]);
 const [w,wi]=wAt(idx);
 t.userData.w=w;t.userData.idx=idx;t.userData.fl=[];t.userData.col=null;t.userData.mx=[];t.userData.cr=[];

 const colT=w.deco==='water'&&wi%3===1&&idx>=3;
 if(!colT){const rm=new THREE.Mesh(G.plane,(w.deco==='tree'?jm().road:w.deco==='bld'?cmat().road:(w.mat||(w.mat=new THREE.MeshLambertMaterial({map:roadTex(w)})))));
 rm.rotation.x=-Math.PI/2;rm.scale.set(8,TL,1);t.add(rm)}
 if(w.deco==='water')for(const sx of[-3.9,3.9]){t.add(mk('box',0x4d3722,sx,.8,0,.12,.1,TL));for(const z of[-12,0,12])t.add(mk('box',0x4d3722,sx,.45,z,.14,.9,.14))}
 if(wi===0&&idx>0){ // glowing gate marks the start of a new world
  const r=new THREE.Mesh(G.ring||(G.ring=new THREE.TorusGeometry(5,.15,8,40)),w.rmat||(w.rmat=new THREE.MeshBasicMaterial({color:w.ring})));
  r.position.set(0,2.5,14);t.add(r);
 }
 if(w.deco==='water'){const wp=new THREE.Mesh(G.plane,wm()),w2=new THREE.Mesh(G.plane,wm.m2);wp.rotation.x=w2.rotation.x=-Math.PI/2;wp.position.y=-.9;w2.position.y=-.87;wp.scale.set(44,TL,1);w2.scale.set(44,TL,1);t.add(mk('plane',0x0d3550,0,-3.2,0,44,TL,1),wp,w2)}
 else for(const sx of[-14,14]){const m=mk('plane',w.side,sx,-.02,0,20,TL,1);if(w.deco==='tree')m.material=jm().side;if(w.deco==='bld')m.material=cmat().side;t.add(m)}
 if(w.deco==='bld')for(const sx of[-4.7,4.7]){const p=new THREE.Mesh(G.plane,cmat().walk);p.rotation.x=-Math.PI/2;p.position.set(sx,.03,0);p.scale.set(1.4,TL,1);t.add(p)}
 if(w.deco!=='tree'){t.add(mk('plane',0xdddddd,-1.1,.01,0,.08,TL,1));t.add(mk('plane',0xdddddd,1.1,.01,0,.08,TL,1))}

 if(w.deco==='tree')for(let i=0;i<2;i++){
  const p=new THREE.Mesh(G.plane,gm()),q=2.5+Math.random()*2.5;
  p.rotation.x=-Math.PI/2;p.rotation.z=Math.random()*6.3;p.scale.set(q,q*(.7+Math.random()*.6),1);
  p.position.set((Math.random()-.5)*6,.02,(Math.random()-.5)*TL);t.add(p);
 }
 // side decor
 for(const s of[-1,1])for(let k=0;k<4;k++){
  const z=-12+k*8+Math.random()*3,x=s*(6+Math.random()*5);
  if(w.deco==='water'){wdec(t,x,z,s)}
  else if(w.deco==='tree'&&PR.CommonTree_3){jdec(t,x,z,s)}
  else if(w.deco==='tree'){
   t.add(mk('cyl',0x5a3b1e,x,1.5,z,.6,3,.6));
   t.add(mk('cone',0x1f6b2a,x,4,z,3,3.5,3));
  }else{
   const bm=new THREE.Mesh(bgeo(6+Math.random()*10),cmat().walls[k%3]);bm.position.set(x,bm.geometry.parameters.height/2,z);t.add(bm);
  }
 }
 // coins + obstacles
 if(w.deco==='water')wprops(t,idx);
 if(idx<2)return;
 if(colT){collapse(t,w);return}
 let hp=0;
 for(const z of[-12,-6,0,6,12]){
  if(hp){hp=0;continue}
  const r=Math.random(),l=Math.floor(Math.random()*3);since++;
  if(r<.4){
   for(let j=-1;j<=1;j++)item(t,mk('box',0xffd400,LX[l],1,z+j*1.5,.55,.55,.12),'coin');
  }else if(r<.7+.16*Math.min(1,dist/4000)&&!(idx<3&&-(t.position.z+z)<35)){ // no obstacles in the first ~35 m
   const q=Math.random();let o=w.deco==='tree'?(q<.28?0:q<.42?1:q<.72?3:4):w.deco==='water'?(q<.5?0:1):(q<.35?0:q<.55?1:2);if(o===1&&since<4)o=0;if(o===1)since=0; // overhead beams need a gap
   if(o===0){ // low obstacle: jump
    if(w.deco==='water'&&PW['Barrel 1']){ // barrels and crates on the bridge: jump over
     const o=pw(t,['Barrel 1','Crate 1','Crate 2'][Math.floor(Math.random()*3)],LX[l],z,1.25,0);item(t,o,'low');
    }else if(w.deco!=='bld'&&PR.Rock_Medium_1&&PR.Rock_Medium_3){ // boulder: jump over it
     const rk=PR[Math.random()<.5?'Rock_Medium_1':'Rock_Medium_3'].clone(true);
     rk.scale.setScalar(.5);rk.position.set(LX[l],.1,z);rk.rotation.y=Math.random()*6.3;item(t,rk,'low');
    }else{
     const m=w.deco==='tree'?mk('cyl',0x6b4423,LX[l],.45,z,.8,2,.8):mk('box',0xd9382b,LX[l],.45,z,2,.9,.5);
     if(w.deco==='tree')m.rotation.z=Math.PI/2;
     item(t,m,'low');
    }
   }else if(o===1){ // overhead: slide
    if(w.deco==='tree'&&PR.CommonTree_5&&PR.Rock_Medium_3){ // fallen tree resting on two boulders: slide under it
     const g=new THREE.Group(),tr=trunk();
     tr.rotation.z=Math.PI/2;tr.scale.setScalar(1.5);tr.position.set(4.1,2,0);g.add(tr);
     for(const sx of[-4.4,4.4]){const rk=PR.Rock_Medium_3.clone(true);rk.scale.setScalar(.7);rk.position.set(sx,0,0);g.add(rk)}
     g.position.z=z;item(t,g,'high');
    }else if(w.deco==='water'){ // wooden gate on the bridge: slide under the beam
     const g=new THREE.Group();
     g.add(mk('box',0x5a3f26,0,2.2,0,7.4,.35,.35));
     for(const sx of[-3.5,3.5])g.add(mk('box',0x4d3722,sx,1.2,0,.4,2.4,.4));
     for(const sx of[-3.1,3.1]){const br=mk('box',0x4d3722,sx,1.9,0,.18,.9,.18);br.rotation.z=sx>0?.8:-.8;g.add(br)}
     g.position.z=z;item(t,g,'high');
    }else item(t,mk('box',0x777777,0,2.2,z,7,.8,.8),'high');
   }else if(o===3){ // tree roots: change lane (1 or 2 lanes, sometimes at opposite sides)
    for(const ln of[[0],[1],[2],[0,2],[0,1],[1,2]][Math.floor(Math.random()*6)]){
     const g=rootObj();g.scale.set(.55,.8,.55);g.position.set(LX[ln],0,z);item(t,g,'wall');
    }
   }else if(o===4){ // burning log pile: jump over it
    const ln=Math.floor(Math.random()*3),r=burnLog(),g=r[0];
    r[1].forEach(f=>t.userData.fl.push(f));g.position.set(LX[ln],0,z);item(t,g,'fire');
   }else if(w.deco==='bld'){ // city pothole: stumble; a second one before you recover crashes
    const put1=(ln,zz)=>{const g=potV()[Math.floor(Math.random()*5)].clone(true);g.scale.x=Math.random()<.5?-1:1;g.position.set(LX[ln],0,zz);item(t,g,'hole')};
    put1(l,z);
    if(Math.random()<.45&&z<=6){put1((l+1+Math.floor(Math.random()*2))%3,z+6);hp=1}
   }else item(t,mk('box',0x6b4423,LX[l],.45,z,1.6,.9,.8),'low');
  }
 }
}

// Game state
let cx=0,stm=0,jb=0,run=false,dead=false,v,dist,coins,lane,px,py,vy,sl,ph=0,curW=null,deadAt=0;
const $=id=>document.getElementById(id);
function reset(){
 tiles.forEach((t,i)=>{t.position.z=TL-i*TL;build(t,i)});
 cx=0;stm=0;jb=0;tc=NT;v=14;dist=0;coins=0;lane=1;px=0;py=0;vy=0;sl=0;dead=false;
 P.position.set(0,0,0);P.scale.y=1;play('run');
 $('co').textContent='🪙 0';$('sc').textContent='0 m';
}
function over(){
 dead=true;run=false;deadAt=performance.now();play('die');
 $('msg').innerHTML='<h1>Crashed!</h1><p>'+Math.floor(dist)+' m · 🪙 '+coins+'</p><p><b>Tap to retry</b></p>';
 $('msg').style.display='flex';
}
function update(dt){
 v=Math.min(Math.min(46,34+dist/500),v+dt*.3);dist+=v*dt;
 stm=Math.max(0,stm-dt);const ve=stm>0?v*(.5+.5*(1-stm/1.3)):v;dist+=ve*dt-v*dt;
 for(const t of tiles)t.position.z+=ve*dt;colUpd(dt);
 for(const t of tiles)if(t.position.z>45){
  const m=Math.min(...tiles.map(x=>x.position.z));
  t.position.z=m-TL;build(t,tc++);
 }
 px+=(LX[lane]-px)*Math.min(1,dt*11);P.position.x=px;
 jb-=dt;vy-=32*dt;py+=vy*dt;if(py<=0){py=0;vy=0;if(jb>0){jb=0;jump()}}
 P.position.y=py;
 if(sl>0)sl-=dt;P.scale.y=(sl>0&&!mixer)?.5:1;
 play(sl>0?'slide':py>0?'jump':stm>.7?'stumble':'run');
 $('st').style.opacity=stm>0?1:0;
 ph+=dt*v*.8;
 const sw=py>0?0:Math.sin(ph)*.3;
 legL.position.z=sw;legR.position.z=-sw;
 // collisions
 for(const t of tiles){
  if(Math.abs(t.position.z)>20)continue;
  for(const p of t.userData.col||[])if(p.k>.4&&py<.3&&Math.abs(t.position.z+p.m.position.z)<2.9&&Math.abs(p.m.position.x-px)<1)return over(); // airborne over a sunk plank is safe
  if(Math.abs(t.position.z)<=TL/2&&t.userData.w!==curW){curW=t.userData.w;$('wn').textContent=curW.n}
  for(const m of t.children){
   const ty=m.userData.type;if(!ty)continue;
   const wz=t.position.z+m.position.z;
   if(Math.abs(wz)>.7)continue;
   const same=Math.abs(m.position.x-px)<1.1;
   if(ty==='coin'){if(same&&py<2){m.userData.type=null;m.visible=false;coins++;$('co').textContent='🪙 '+coins}}
   else if(ty==='high'){if(sl<=0)return over()}
   else if(ty==='low'){if(same&&py<.8)return over()}
   else if(ty==='hole'){if(same&&py<.15){m.userData.type='holed';if(stm>0)return over();stm=1.3}}
   else if(ty==='wall'){if(same&&py<2.2)return over()}
   else if(ty==='fire'){if(same&&py<1.3)return over()}
  }
 }
 $('sc').textContent=Math.floor(dist)+' m';
}
function cam(dt){
 cx+=(px*.5-cx)*Math.min(1,dt*7);
 const sh=stm>0?.14:0;C.position.set(cx+(Math.random()-.5)*sh,4.2+(Math.random()-.5)*sh,7);C.lookAt(cx,1.5,-8);
 let aw=curW;for(const t of tiles)if(t.position.z<=-45&&t.position.z>-75)aw=t.userData.w||aw;
 if(aw){
  const col=new THREE.Color(aw.sky);
  S.background.lerp(col,Math.min(1,dt*1.2));
  S.fog.color.copy(S.background);
 }
}

// Input
let sx=0,sy=0,fired=false;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;fired=false});
addEventListener('pointermove',e=>{
 if(!run||fired)return;
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)<28&&Math.abs(dy)<28)return;
 fired=true;
 if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else act(dy<0?'u':'d');
});
addEventListener('pointerup',e=>{
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(!run){
  if(ready&&Math.abs(dx)<20&&Math.abs(dy)<20&&(!dead||performance.now()-deadAt>500)){
   reset();$('msg').style.display='none';run=true;
  }
  return;
 }
 if(fired||(Math.abs(dx)<25&&Math.abs(dy)<25))return;
 if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else act(dy<0?'u':'d');
});
addEventListener('keydown',e=>{
 const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',' ':'u'}[e.key];
 if(k&&run)act(k);
});
function jump(){vy=11;sl=0;py=.03;if(cur&&cur===acts.jump)acts.jump.reset().play()}
function act(a){
 if(a==='l')lane=Math.max(0,lane-1);
 else if(a==='r')lane=Math.min(2,lane+1);
 else if(a==='u'){if(py<=.02)jump();else jb=.3} // press jump just before landing = jumps again on landing
 else if(a==='d'){sl=.6;if(py>0)vy=-18;if(cur&&cur===acts.slide)acts.slide.reset().play()} // swipe down again = roll again
}

reset();
let last=performance.now();
(function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(run)update(dt);
 else if(!dead)for(const t of tiles)t.position.z+=0;
 if(mixer)mixer.update(dt);
 for(const t of tiles)for(const m of t.userData.mx||[])m.update(dt);
 fx(now/1000);cam(dt);
 R.render(S,C);
})(last);
</script>
