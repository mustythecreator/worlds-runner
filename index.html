<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Worlds Runner</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 4px #000;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:rgba(0,0,0,.5);text-shadow:0 2px 4px #000}
#st{position:fixed;top:24%;left:0;right:0;text-align:center;color:#ffb36b;font:700 24px sans-serif;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .15s;pointer-events:none}
#sc small{display:block;font-size:13px;opacity:.85}
#pu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 68px);left:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.pr{display:flex;align-items:center;gap:6px}
.pr img{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0008;background:#1b2447}
.pr b{display:block;width:120px;height:14px;border-radius:8px;background:#1b2447;border:2px solid #fff;overflow:hidden;box-shadow:0 2px 6px #0008}
.pr i{display:block;height:100%;transition:width .15s linear}
#stash{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:12px;justify-content:center;pointer-events:none}
#stash img{width:54px;height:54px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #000a;background:#1b2447;pointer-events:auto}
#stash img.first{border-color:#ffd84a;animation:pls 1s infinite}
@keyframes pls{50%{transform:scale(1.14)}}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:900 150px sans-serif;color:#fff;text-shadow:0 4px 18px #000;pointer-events:none;z-index:15}
#mt{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:none;align-items:center;gap:6px;color:#fff;font:800 22px sans-serif;text-shadow:0 2px 4px #000;pointer-events:none;transition:transform .2s}
#mt img{width:54px;height:54px;border-radius:50%;border:3px solid #33d0e0;background:#1b2447;box-shadow:0 2px 8px #000a}
#mt.rdy img{animation:pls 1s infinite}
#pop{position:fixed;left:0;right:0;top:32%;display:none;flex-direction:column;align-items:center;color:#fff;font:900 34px sans-serif;text-shadow:0 3px 10px #000;pointer-events:none;z-index:12}
#pop img{width:96px;height:96px;border-radius:50%;border:4px solid #ffd84a;background:#1b2447}
#ky{position:fixed;right:18px;top:calc(env(safe-area-inset-top,0px) + 46px);color:#fff;font:700 18px sans-serif;text-shadow:0 2px 4px #000;transition:transform .2s;pointer-events:none}
#cont{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20;color:#fff;font-family:sans-serif;text-align:center}
.cc{background:#1b2447;border:3px solid #fff;border-radius:22px;padding:22px 26px;min-width:250px}
.kk{font-size:56px}.cc h2{margin:4px 0}
.cb{height:10px;background:#0006;border-radius:6px;margin:12px 0;overflow:hidden}.cb i{display:block;height:100%;background:#ffd84a;width:100%}
#cont button{display:block;width:100%;margin-top:10px;font:700 18px sans-serif;padding:12px;border-radius:14px;border:0}
#cy{background:#ffd84a;color:#3a2a00}#cn{background:#33406e;color:#fff}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#msg h1{font-size:36px;margin:0 0 10px}#msg p{margin:4px 0;font-size:17px}
</style></head><body>
<div id="hud"><span id="sc">0<small>0 m</small></span><span id="wn"></span><span id="co">🪙 0</span></div>
<div id="pu"></div><div id="flash"></div><div id="stash"></div><span id="ky">🔑 0</span><div id="mt"><img><b>×0</b></div><div id="pop"><img><span>+1</span></div><div id="cd"></div>
<div id="cont"><div class="cc"><div class="kk">🔑</div><h2>Continue?</h2><div class="cb"><i></i></div><button id="cy">Use 1 🔑</button><button id="cn">No thanks</button></div></div>
<div id="st">Stumbled! Avoid the next one</div>
<div id="msg"><h1>Worlds Runner</h1><p>Swipe ← → to change lane</p><p>Swipe ↑ to jump · ↓ to slide</p><p>Double-tap = use a hover mat if you own one · tap a stored icon to use it</p><p><b>Tap to start</b></p><p><button id="skin" style="font:600 17px sans-serif;padding:10px 18px;border-radius:22px;border:1px solid #fff8;background:#0006;color:#fff">Runner: Hero  ▶</button></p>
<p id="dbg2" style="font-size:12px;opacity:.8;max-width:90%;word-break:break-all;margin:2px 0"></p>
<p id="dbg" style="font-size:13px;opacity:.85;max-width:90%;word-break:break-all">v10 · loading character…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
const W=[
 {n:'Jungle',len:32,ring:0x7dff9a,sky:0xaed8d2,road:0x6b4a2b,side:0x2e8b3a,deco:'tree'},
 {n:'City',len:32,ring:0x7ab8ff,sky:0xb4c8dc,road:0x45484f,side:0x6d7482,deco:'bld'},
 {n:'Water',len:32,ring:0x6fe0ff,sky:0xb5e0ee,road:0x6a4d2e,side:0x2a6f9a,deco:'water'},
 {n:'Reef',len:32,ring:0x7affd9,sky:0x0b6f93,road:0xd8c490,side:0x2a7f8f,deco:'reef',fog:[16,80]}
];
const LX=[-2.2,0,2.2],TL=30,NT=7;
{const q=new URLSearchParams(location.search).get('len');if(q)W.forEach(w=>w.len=+q)} // test shortcut: add ?len=4 to the page link to cycle worlds quickly
// each world's length is its own 'len' in W above (in tiles of 30 m)
function wAt(idx){let i=idx%W.reduce((a,b)=>a+b.len,0),k=0;while(i>=W[k].len){i-=W[k].len;k++}return[W[k],i]}
// Jungle ground textures (files in assets/textures/). Swap names here to try another road or side.
const ROAD='Ground086_2K-JPG',SIDE='Grass002_1K-JPG',TXL=new THREE.TextureLoader();let AX=8;
function tx(f,rx,ry){const t=TXL.load('assets/textures/'+f);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=AX;return t}
function jm(){
 if(jm.r)return jm.r;
 const mat=(n,rx,ry,c)=>{const m=new THREE.MeshStandardMaterial({map:tx(n+'_Color.jpg',rx,ry),normalMap:tx(n+'_NormalDX.jpg',rx,ry),roughness:.95,metalness:0});m.normalScale.set(1,-1);if(c)m.color.set(c);return m};
 return jm.r={road:mat(ROAD,4,15,0xb08060),side:mat(SIDE,7,10)};
}
function gm(){ // soft gravel patches blended into the mud road
 if(gm.m)return gm.m;
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 const r=g.createRadialGradient(64,64,6,64,64,62);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.6,'rgba(255,255,255,.7)');r.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=r;g.fillRect(0,0,128,128);
 const m=new THREE.MeshStandardMaterial({map:tx('Gravel025_2K-JPG_Color.jpg',1,1),alphaMap:new THREE.CanvasTexture(c),transparent:true,depthWrite:false,roughness:1,color:0x8a7660,opacity:.85,polygonOffset:true,polygonOffsetFactor:-2});
 m.normalScale.set(1,-1);return gm.m=m;
}
function fxm(){ // Kenney particle sprites, tinted in code
 if(fxm.f5)return fxm;
 const sm=(f,c,add,op)=>new THREE.SpriteMaterial({map:TXL.load('assets/fx/'+f),color:c,transparent:true,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,opacity:op||1});
 fxm.f5=sm('flame_05.png',0xff7a18,1);fxm.f6=sm('flame_06.png',0xffb23a,1);
 fxm.fi=sm('fire_01.png',0xff5a10,1,.75);fxm.gl=sm('circle_05.png',0xff7a1a,1,.4);
 fxm.em=sm('star_05.png',0xffd060,1);fxm.sk=sm('flame_02.png',0x2b2b2b,0,.32);
 fxm.lg=new THREE.CylinderGeometry(.27,.3,1.5,12);
 const bt=TXL.load('assets/jungle/Bark_NormalTree.png');bt.wrapS=bt.wrapT=THREE.RepeatWrapping;bt.repeat.set(2,1);
 fxm.lm=new THREE.MeshStandardMaterial({map:bt,roughness:1,color:0x4a3a30,emissive:0x3a1000});
 return fxm;
}
function burnLog(){ // burning log pile: jump over it
 const g=new THREE.Group(),F=fxm(),fl=[];
 const l1=new THREE.Mesh(F.lg,F.lm);l1.rotation.z=Math.PI/2;l1.position.y=.3;g.add(l1);
 const l2=new THREE.Mesh(F.lg,F.lm);l2.scale.set(.8,.8,.8);l2.rotation.z=Math.PI/2;l2.rotation.y=1.0;l2.position.y=.62;g.add(l2);
 const add=(m,k,o,x,y,z,sc)=>{const f=new THREE.Sprite(k==='s'?m.clone():m);f.userData=Object.assign({k,x,y,z,s:sc,p:Math.random()},o);f.position.set(x,y,z);f.scale.set(sc,sc,1);g.add(f);fl.push(f)};
 add(F.gl,'g',{},0,.6,.1,3.2);add(F.fi,'g',{},0,.8,.15,1.7);
 for(let i=0;i<5;i++)add(i%2?F.f6:F.f5,'f',{},-.55+i*.28,1.05,(Math.random()-.5)*.3,1.7+Math.random()*.5);
 for(let i=0;i<5;i++)add(F.em,'e',{v:.35+Math.random()*.4},(Math.random()-.5)*1,1.3,0,.28);
 for(let i=0;i<2;i++)add(F.sk,'s',{},0,1.4,0,1);
 return[g,fl];
}
function woodTex(){
 const c=document.createElement('canvas');c.width=256;c.height=960;const g=c.getContext('2d');
 for(let i=0;i<30;i++){const sh=60+Math.random()*30;g.fillStyle='rgb('+(sh+45)+','+(sh+20)+','+(sh-5)+')';g.fillRect(0,i*32,256,30);g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,i*32+30,256,2);
  for(let k=0;k<7;k++){g.fillStyle='rgba(0,0,0,.12)';g.fillRect(Math.random()*256,i*32,1.5,30)}}
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
function wm(){ // translucent moving water + a second shimmer layer drifting the other way
 if(wm.m)return wm.m;
 const mkc=(draw)=>{const c=document.createElement('canvas');c.width=c.height=256;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,6);return t};
 const base=mkc(g=>{g.fillStyle='#2c7fa8';g.fillRect(0,0,256,256);g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=2;
  for(let i=0;i<46;i++){const x=Math.random()*226,y=Math.random()*256;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+14,y-6,x+28,y);g.stroke()}});
 const top=mkc(g=>{g.clearRect(0,0,256,256);g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;
  for(let i=0;i<34;i++){const x=Math.random()*210,y=Math.random()*256;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+22,y-9,x+44,y);g.stroke()}
  for(let i=0;i<60;i++){g.fillStyle='rgba(255,255,255,'+Math.random()*.5+')';g.fillRect(Math.random()*256,Math.random()*256,2,2)}});
 top.repeat.set(5,4);
 wm.m2=new THREE.MeshBasicMaterial({map:top,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending});
 wm.m=new THREE.MeshPhongMaterial({map:base,transparent:true,opacity:.74,shininess:70,specular:0xaaddff,color:0xa8e0f0});
 new THREE.TextureLoader().load('assets/textures/tex_Water.jpg',t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,6);wm.m.map=t;wm.m.bumpMap=t;wm.m.bumpScale=1.4;wm.m.needsUpdate=true},null,()=>{});
 return wm.m;
}
// ---- Water-world props (Kenney Nature/Pirate, fish bundle, wood frame set)
const PW={},WN=['lily_large','lily_small','canoe','log_large','boat-row-small','boat-row-large','ship-small','ship-wreck','Dolphin','Manta ray','Shark','Fish','Dock Long','Dock Wide','Dock Stairs','Barrel 1','Crate 1','Torch 1','Fire Pit 1'];
function pw(t,n,x,z,sc,y,ry){const e=PW[n];if(!e)return;const o=e.s.clone(true);o.position.set(x,y,z);o.scale.setScalar(sc);o.rotation.y=ry===undefined?Math.random()*6.28:ry;t.add(o);return o}
function crt(t,n,sc,k){ // animated sea creature
 const e=PW[n];if(!e||!THREE.SkeletonUtils)return;
 const o=THREE.SkeletonUtils.clone(e.s);o.scale.setScalar(sc);o.traverse(c=>{c.frustumCulled=false});
 const g=new THREE.Group();g.add(o);g.userData=k;t.add(g);t.userData.cr.push(g);
 if(e.a.length){const m=new THREE.AnimationMixer(o);m.clipAction(e.a[0]).play();t.userData.mx.push(m)}
}
function bob(t,o){if(!o)return;o.userData={kind:'bob',y:o.position.y,p:Math.random()};t.userData.cr.push(o)}
function wprops(t,idx){
 const R=Math.random;
 for(const s of[-1,1]){
  if(R()<.75)for(let i=0;i<4;i++)bob(t,pw(t,R()<.6?'lily_large':'lily_small',s*(4.8+R()*3.2),(R()-.5)*28,4+R()*1.6,-.7));
  if(R()<.55)bob(t,pw(t,R()<.5?'boat-row-small':'boat-row-large',s*(6+R()*3),(R()-.5)*20,1.7,-1.0));
  if(R()<.18)bob(t,pw(t,R()<.5?'ship-small':'ship-wreck',s*(15+R()*5),(R()-.5)*20,1.8,-.9));
  if(R()<.12)pw(t,['Dock Long','Dock Wide','Dock Stairs'][Math.floor(R()*3)],s*7.2,(R()-.5)*8,.5,-.9,0);
  if(R()<.35){const c=R()<.5;bob(t,pw(t,c?'canoe':'log_large',s*(5+R()*3),(R()-.5)*24,c?4.5:4,-.85))}
 }
 const F=fxm();
 for(const sx of[-3.9,3.9])for(const z of[-12,12]){ // torches on the rail posts
  if(!pw(t,'Torch 1',sx,z,2.2,.9,0))continue;
  const add=(m,k,sc,y)=>{const f=new THREE.Sprite(m);f.userData={k,s:sc,x:sx,y,z,p:R()};f.position.set(sx,y,z);f.scale.set(sc,sc,1);t.add(f);t.userData.fl.push(f)};
  add(F.f5,'f',.9,2.35);add(F.gl,'g',2.2,2.3);
 }
 const J=[['Dolphin',.34],['Dolphin',.34],['Fish',.2]],GL2=[['Manta ray',.3],['Shark',.26]];
 const spawn=(c,kind,sd,y)=>crt(t,c[0],c[1],{kind,x:sd*(5.2+R()*4),y,z:(R()-.5)*14,p:R(),sp:kind==='jump'?.35+R()*.25:.2+R()*.15,ry:sd>0?-1.57:1.57});
 spawn(J[Math.floor(R()*3)],'jump',-1,0);spawn(J[Math.floor(R()*3)],'jump',1,0);spawn(GL2[Math.floor(R()*2)],'glide',R()<.5?-1:1,-1.05);
}
function wdec(t,x,z,s){const r=Math.random();
 if(r<.12)put(t,r<.06?'Rock_Medium_1':'Rock_Medium_3',x,z,.9+Math.random()*.8,-.9);
 else if(r<.7)put(t,'Grass_Wispy_Tall',s*(4.6+Math.random()*1.2),z,1.6,-.9);
}
function collapse(t,w){ // bridge section: two lanes sink as you approach, one stays
 const ls=Math.floor(Math.random()*3);t.userData.col=[];
 if(!w.pm){const pt=roadTex(w).clone();pt.needsUpdate=true;pt.wrapS=pt.wrapT=THREE.RepeatWrapping;pt.repeat.set(.275,.2);w.pm=new THREE.MeshLambertMaterial({map:pt})}
 for(let ln=0;ln<3;ln++)for(let i=0;i<5;i++){
  const m=new THREE.Mesh(G.pan||(G.pan=new THREE.BoxGeometry(2.1,.25,5.9)),w.pm);m.position.set(LX[ln],-.12,-12+i*6);t.add(m);
  if(ln!==ls)t.userData.col.push({m,k:0,on:0,r:(Math.random()<.5?-1:1)*(.4+Math.random()*.5)});
 }
 for(const sx of[-3.6,3.6])t.add(mk('box',0x5a3f26,sx,-.12,0,.8,.25,TL));
 for(let ln=0;ln<3;ln++)for(let i=-2;i<=2;i++)coinAt(t,LX[ln],1,i*6+(ln-1)*1.5); // all lanes, so coins don't reveal the safe one
}
function colUpd(dt){for(const t of tiles)for(const p of t.userData.col||[]){
 if(p.fz)continue;
 if(!p.on&&t.position.z+p.m.position.z>-34)p.on=1;
 if(p.on&&p.k<1){p.k=Math.min(1,p.k+dt*1.8);p.m.position.y=-.12-p.k*1.6;p.m.rotation.x=p.r*p.k;p.m.rotation.z=p.r*.5*p.k}
}}
function potV(){ // rough patched-and-broken road with a pothole (cached variants)
 if(potV.v)return potV.v;
 const jag=(rx,rz,n,j)=>{const sh=new THREE.Shape();for(let i=0;i<n;i++){const a=i/n*6.283,r=1-j/2+Math.random()*j,x=Math.cos(a)*rx*r,y=Math.sin(a)*rz*r;i?sh.lineTo(x,y):sh.moveTo(x,y)}sh.closePath();return new THREE.ShapeGeometry(sh)};
 let lay=0;
 const fl=(g,c,y,x,z)=>{lay++;const tx_=lay<=2,m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:tx_?(lay===1?0xb0a8a0:0x8c857e):c,map:tx_?cmat().dmg:null,polygonOffset:true,polygonOffsetFactor:-lay,polygonOffsetUnits:-lay}));m.rotation.x=-Math.PI/2;m.position.set(x||0,y,z||0);return m};
 potV.v=[0,1,2,3,4].map(()=>{
  const g=new THREE.Group();lay=0;
  g.add(fl(jag(1.05,1.5,16,.18),0x303136,.014));
  g.add(fl(jag(.9,1.2,14,.25),0x232428,.018,.05,-.1));
  g.add(fl(jag(.78,.95,12,.4),0x4b3a2b,.024,0,.05));
  g.add(fl(jag(.6,.75,11,.45),0x15110d,.03,0,.05));
  g.add(fl(jag(.3,.4,9,.5),0x050505,.034,.05,.1));
  for(let i=0;i<7;i++){const a=Math.random()*6.28,d=.75+Math.random()*.35,m=mk('box',0x777a82,Math.cos(a)*d,.06,Math.sin(a)*d*1.2,.12+Math.random()*.14,.08+Math.random()*.1,.12+Math.random()*.14);m.rotation.y=Math.random()*3;g.add(m)}
  for(let i=0;i<3;i++){const c=fl(new THREE.PlaneGeometry(.05,1+Math.random()*.8),0x0a0a0c,.02,(Math.random()-.5)*1.6,(Math.random()-.5)*2);c.rotation.z=Math.random()*3;g.add(c)}
  return g;
 });
 return potV.v;
}
function fx(tm){
 if(causM.m)causM.m.map.offset.set(tm*.03,tm*.045);
 if(wm.m){wm.m.map.offset.set(tm*.015,tm*.06);wm.m2.map.offset.set(-tm*.02,tm*.035)}
 for(const t of tiles)for(const m of t.children){const ty=m.userData.type;if(ty==='coin')m.rotation.y=tm*4+m.position.z;else if(ty==='pu'){m.rotation.y=tm*2.2;m.position.y=1.15+Math.sin(tm*3+m.position.z)*.12}}
 for(const t of tiles)for(const c of t.userData.cr||[]){const k=c.userData,u=(tm*k.sp+k.p)%1;
  if(k.kind==='bob'){c.position.y=k.y+Math.sin(tm*1.6+k.p*6)*.07;c.rotation.z=Math.sin(tm*1.2+k.p*5)*.05;c.rotation.x=Math.sin(tm*.9+k.p*4)*.03}
  else if(k.kind==='walker'){const x=((tm*1.2*k.dir+k.p*10)%10+10)%10-5;c.position.set(x,k.y,k.z)}
  else if(k.kind==='sway'){c.rotation.z=Math.sin(tm*1.4+k.p*6)*.12;c.rotation.x=Math.sin(tm*1.1+k.p*4)*.08}
  else if(k.kind==='ray'){c.rotation.z=k.rz+Math.sin(tm*.4+k.p*6)*.07}
  else if(k.kind==='bub'){const uu=(tm*k.sp+k.p)%1;c.position.set(k.x+Math.sin(tm*1.6+k.p*20)*.3,.3+uu*10,k.z)}

    if(Math.random()<.5){const P=[['Fire hydrant',.9,'y'],['Bench',1.6,'max'],['Trash Can',1.0,'y'],['Bus Stop',3,'max'],['Planter & Bushes',2,'max']][Math.floor(Math.random()*5)],
     p=pc(P[0],P[1],P[2]);if(p){p.position.set(s*(4.4+Math.random()*.6),.03,z+(Math.random()-.5)*5);p.rotation.y=s>0?-Math.PI/2:Math.PI/2;p.userData.sw=1;t.add(p)}}
   }
  }
 }
 // coins + obstacles (one event stream, see genTile)
 if(w.deco==='water')wprops(t,idx);
 if(w.deco==='reef')rprops(t,idx);
 if(idx<2)return;
 if(colT){collapse(t,w);GEN.next=Math.max(GEN.next,(idx-1)*TL+28);return}
 genTile(t,idx,w);
}

// Game state
let mag=0,sm=1,smT=0,cm=1,cmT=0,bootT=0,matT=0,matBrk=0,inv=0,hov=0,score=0,cx=0,stm=0,jb=0,run=false,dead=false,v,dist,coins,lane,px,py,vy,sl,ph=0,curW=null,deadAt=0;
const $=id=>document.getElementById(id);
function reset(){
 genReset();
 tiles.forEach((t,i)=>{t.position.z=TL-i*TL;build(t,i)});
 mag=0;sm=1;smT=0;cm=1;cmT=0;bootT=0;matT=0;matBrk=0;inv=0;hov=0;score=0;revives=0;contOpen=false;$('cont').style.display='none';fxOff();reviveCd=0;$('cd').style.display='none';RV.forEach(q=>FX.remove(q.o));RV.length=0;puHud();stashUI();keyHud();matHud(false);
 cx=0;stm=0;jb=0;tc=NT;v=14;dist=0;coins=0;lane=1;px=0;py=0;vy=0;sl=0;dead=false;
 P.position.set(0,0,0);P.scale.y=1;play('run');
 $('co').textContent='🪙 0';$('sc').innerHTML='0<small>0 m</small>';
}
let revives=0,contOpen=false,contT=0,reviveCd=0,cdShown=0;
function over(){
 dead=true;run=false;deadAt=performance.now();play('die');fxOff();
 const cost=revives+1;
 if(keys>=cost&&revives<3){contOpen=true;contT=6;$('cy').textContent='Use '+cost+' \ud83d\udd11';$('cont').style.display='flex';return}
 gameOver();
}
function revive(){
 const cost=revives+1;if(!contOpen||keys<cost)return;
 keys-=cost;saveKeys();keyHud();revives++;contOpen=false;$('cont').style.display='none';
 for(const t of tiles){
  for(const m of t.children){const ty=m.userData.type;if(!ty||ty==='coin'||ty==='pu')continue;const wz=t.position.z+m.position.z;if(wz>-70&&wz<12){m.userData.type=null;m.visible=false}}
  for(const p of t.userData.col||[]){const wz=t.position.z+p.m.position.z;if(wz>-70&&wz<14){p.fz=1;p.k=0;p.on=0;p.m.position.y=-.12;p.m.rotation.set(0,0,0)}}
 }
 dead=false;stm=0;vy=0;py=0;sl=0;v=Math.max(14,v*.7);P.scale.y=1;play('idle');
 reviveCd=3;cdShown=3;const c=$('cd');c.style.display='flex';c.textContent='3';
}
function gameOver(){
 contOpen=false;$('cont').style.display='none';
 $('msg').innerHTML='<h1>Crashed!</h1><p>'+Math.floor(score)+' pts · '+Math.floor(dist)+' m · 🪙 '+coins+'</p><p><b>Tap to retry</b></p>';
 $('msg').style.display='flex';
}
function update(dt){
 const d0=dist;
 v=Math.min(Math.min(46,34+dist/500),v+dt*.3);dist+=v*dt;
 for(const t of tiles)for(const m of t.children)if(m.userData.vz){const k=Math.max(0,Math.min(1,(t.position.z+m.position.z+55)/20));m.position.z=Math.min(12.5,m.position.z+m.userData.vz*k*dt)}
 stm=Math.max(0,stm-dt);const ve=stm>0?v*(.5+.5*(1-stm/1.3)):v;dist+=ve*dt-v*dt;score+=(dist-d0)*sm;
 if(mag>0)mag-=dt;if(smT>0){smT-=dt;if(smT<=0)sm=1}if(cmT>0){cmT-=dt;if(cmT<=0)cm=1}if(bootT>0)bootT-=dt;if(matT>0)matT-=dt;if(inv>0)inv-=dt;
 for(const t of tiles)t.position.z+=ve*dt;colUpd(dt);
 for(const t of tiles)if(t.position.z>45){
  const m=Math.min(...tiles.map(x=>x.position.z));
  t.position.z=m-TL;build(t,tc++);
 }
 px+=(LX[lane]-px)*Math.min(1,dt*11);P.position.x=px;
 jb-=dt;vy-=32*dt;py+=vy*dt;if(py<=0){py=0;vy=0;if(jb>0){jb=0;jump()}}
 hov+=((matT>0?.35+Math.sin(performance.now()/330)*.03:0)-hov)*Math.min(1,dt*10);P.position.y=py+hov;
 if(sl>0)sl-=dt;P.scale.y=(sl>0&&!mixer)?.5:1;
 play(sl>0?'slide':py>0?'jump':stm>.7?'stumble':matT>0?'idle':'run');
 $('st').style.opacity=stm>0?1:0;
 ph+=dt*v*.8;
 const sw=py>0?0:Math.sin(ph)*.3;
 legL.position.z=sw;legR.position.z=-sw;
 if(mag>0)for(const t of tiles){if(Math.abs(t.position.z)>45)continue;for(const m of t.children){if(m.userData.type!=='coin')continue;const wz=t.position.z+m.position.z;if(wz<-13||wz>3)continue;const k=Math.min(1,dt*9);m.position.x+=(px-m.position.x)*k;m.position.y+=(1.1+Math.min(py,1.5)*.5-m.position.y)*k;m.position.z+=(-t.position.z-m.position.z)*Math.min(1,dt*5)}}
 // collisions
 for(const t of tiles){
  if(Math.abs(t.position.z)>20)continue;
  for(const p of t.userData.col||[])if(p.k>.4&&py<.3&&Math.abs(t.position.z+p.m.position.z)<2.9&&Math.abs(p.m.position.x-px)<1&&matT<=0&&hit())return; // airborne or hovering over a sunk plank is safe
  if(Math.abs(t.position.z)<=TL/2&&t.userData.w!==curW){curW=t.userData.w;$('wn').textContent=curW.n}
  for(const m of t.children){
   const ty=m.userData.type;if(!ty)continue;
   const wz=t.position.z+m.position.z;
   if(Math.abs(wz)>(ty==='coin'&&mag>0?1.6:(m.userData.hl||.7)))continue;
   const same=Math.abs(m.position.x-px)<1.1;
   if(ty==='coin'){const cy=m.userData.cy||1;if(same&&(mag>0?py<3:(py>cy-1.35&&py<cy-.25))){m.userData.type=null;m.visible=false;coins+=cm;$('co').textContent='🪙 '+coins}}
   else if(ty==='pu'){if(same&&py<3){m.userData.type=null;m.visible=false;grab(m.userData.k,m.userData.n)}}
   else if(ty==='high'){if(sl<=0&&py<(m.userData.top||99)&&hit())return}
   else if(ty==='low'){if(same&&py<(m.userData.h||.8)&&hit())return}
   else if(ty==='hole'){if(same&&py<.15&&matT<=0){m.userData.type='holed';if(stm>0){if(hit())return}else if(inv<=0)stm=1.3}}
   else if(ty==='wall'){if(same&&py<(m.userData.top||2.2)&&hit())return}
   else if(ty==='fire'){if(same&&py<1.3&&hit())return}
  }
 }
 fxInit();FX.position.set(px,py,0);
 AU.b.visible=bootT>0;
 if(matBrk>0){matBrk-=dt;MT.scale.setScalar(Math.max(.01,matBrk/.45));MT.rotation.y+=dt*14}
 MT.visible=matT>0||hov>.05||matBrk>0;
 if(MT.visible&&matBrk<=0){const tt=performance.now()/1000;if(MT.userData.geo)waveMat(MT,tt);else if(MT.userData.wv)waveGlb(MT,tt);MT.rotation.z=Math.sin(tt*3)*.05;MT.rotation.x=Math.sin(tt*2.3)*.04}
 heldFx();
 for(let i=RV.length-1;i>=0;i--){const q=RV[i];q.t+=dt;q.o.rotation.y+=dt*6;q.o.position.y=2.7+q.t*.6;q.o.scale.setScalar(q.s0*(q.t>.9?Math.max(.01,1-(q.t-.9)/.4):1));if(q.t>1.3){FX.remove(q.o);RV.splice(i,1)}}
 P.visible=inv<=0||Math.floor(inv*12)%2===0;puHud();
 $('sc').innerHTML=Math.floor(score)+'<small>'+Math.floor(dist)+' m</small>';
}
function cam(dt){
 cx+=(px*.5-cx)*Math.min(1,dt*7);
 const sh=stm>0?.14:0;C.position.set(cx+(Math.random()-.5)*sh,4.2+(Math.random()-.5)*sh,7);C.lookAt(cx,1.5,-8);
 let aw=curW;for(const t of tiles)if(t.position.z<=-45&&t.position.z>-75)aw=t.userData.w||aw;
 if(aw){
  const col=new THREE.Color(aw.sky);
  S.background.lerp(col,Math.min(1,dt*1.2));
  S.fog.color.copy(S.background);
  const fg=aw.fog||[45,135],fk=Math.min(1,dt*1.2);S.fog.near+=(fg[0]-S.fog.near)*fk;S.fog.far+=(fg[1]-S.fog.far)*fk;
 }
}

// Input
let sx=0,sy=0,fired=false,lastTap=0;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;fired=false});
addEventListener('pointermove',e=>{
 if(!run||fired)return;
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)<28&&Math.abs(dy)<28)return;
 fired=true;
 if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else act(dy<0?'u':'d');
});
addEventListener('pointerup',e=>{
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(contOpen||reviveCd>0)return;
 if(!run){
  if(ready&&Math.abs(dx)<20&&Math.abs(dy)<20&&(!dead||performance.now()-deadAt>500)){
   reset();$('msg').style.display='none';run=true;
  }
  return;
 }
 if(fired)return;
 if(Math.abs(dx)<25&&Math.abs(dy)<25){const n=performance.now();if(n-lastTap<320){lastTap=0;useMat()}else lastTap=n;return}
 if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else act(dy<0?'u':'d');
});
for(const id of['cy','cn']){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>e.stopPropagation());el.addEventListener('pointerup',e=>{e.stopPropagation();id==='cy'?revive():gameOver()})}
addEventListener('keydown',e=>{
 const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',' ':'u'}[e.key];
 if(k&&run)act(k);
});
function jump(){vy=bootT>0?15.5:11;sl=0;py=.03;if(cur&&cur===acts.jump)acts.jump.reset().play()}
function act(a){
 if(a==='l')lane=Math.max(0,lane-1);
 else if(a==='r')lane=Math.min(2,lane+1);
 else if(a==='u'){if(py<=.02)jump();else jb=.3} // press jump just before landing = jumps again on landing
 else if(a==='d'){sl=.6;if(py>0)vy=-18;if(cur&&cur===acts.slide)acts.slide.reset().play()} // swipe down again = roll again
}

reset();
let last=performance.now();
(function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(run)update(dt);
 else if(contOpen){contT-=dt;const bi=document.querySelector('#cont .cb i');if(bi)bi.style.width=Math.max(0,contT/6*100)+'%';if(contT<=0)gameOver()}
 else if(reviveCd>0){reviveCd-=dt;const n=Math.max(1,Math.ceil(reviveCd));if(n!==cdShown){cdShown=n;document.getElementById('cd').textContent=n}if(reviveCd<=0){reviveCd=0;document.getElementById('cd').style.display='none';inv=3;run=true;play('run')}}
 else if(!dead)for(const t of tiles)t.position.z+=0;
 if(mixer)mixer.update(dt);
 for(const t of tiles)for(const m of t.userData.mx||[])m.update(dt);
 fx(now/1000);cam(dt);
 R.render(S,C);
})(last);
</script>
</body></html>
